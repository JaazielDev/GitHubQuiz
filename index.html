<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz GitHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Quiz GitHub</h1>
    <p id="progresso" class="sub"></p>
    <h2 id="pergunta"></h2>
    <div id="opcoes"></div>
    <div id="resultado" hidden>
      <p id="pontos"></p>
      <p id="mensagem"></p>
      <button id="reiniciar">Jogar de novo</button>
    </div>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
